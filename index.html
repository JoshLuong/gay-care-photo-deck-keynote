<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Photo Deck</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      background: #fff;
      color: #000;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 48px;
      padding: 48px 24px;
    }

    h1 {
      font-size: clamp(2rem, 8vw, 5rem);
      font-weight: 900;
      letter-spacing: -0.02em;
      text-transform: uppercase;
      text-align: center;
    }

    #drop-zone {
      width: min(480px, 100%);
      aspect-ratio: 4/3;
      border: 2px solid #000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      cursor: default;
      transition: background 0.15s;
      user-select: none;
    }

    #drop-zone.over {
      background: #000;
      color: #fff;
    }

    #drop-zone .label {
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    #drop-zone .sub {
      font-size: 0.75rem;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      opacity: 0.5;
    }

    #status {
      font-size: 0.8rem;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      min-height: 1.2em;
      text-align: center;
    }

    #status.error { color: #c00; }

    footer {
      font-size: 0.7rem;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      opacity: 0.35;
      text-align: center;
      line-height: 2;
    }

    a {
      color: inherit;
      text-decoration: none;
      border-bottom: 1px solid currentColor;
    }

    a:hover { opacity: 0.6; }
  </style>
</head>
<body>

  <h1>Photo Deck</h1>

  <div id="drop-zone" aria-label="Drop photo folder here">
    <span class="label">Drop folder here</span>
    <span class="sub">JPEG · TIFF · PNG → Keynote deck</span>
  </div>

  <div id="status"></div>

  <footer>
    First time? <a href="dist/PhotoDeck.app.zip">Download PhotoDeck.app</a> and drag it to Applications.<br>
    Then: open Terminal (⌘+Space, type Terminal, Enter) → <a href="#" onclick="navigator.clipboard.writeText('xattr -cr /Applications/PhotoDeck.app && open /Applications/PhotoDeck.app'); this.textContent='Copied!'; return false;">copy this command</a> → ⌘V in Terminal → Enter.<br>
    After that, return here and drag your folder.
  </footer>

  <script>
    const zone = document.getElementById('drop-zone');
    const status = document.getElementById('status');

    zone.addEventListener('dragover', e => {
      e.preventDefault();
      zone.classList.add('over');
    });

    zone.addEventListener('dragleave', () => zone.classList.remove('over'));

    zone.addEventListener('drop', e => {
      e.preventDefault();
      zone.classList.remove('over');

      const items = Array.from(e.dataTransfer.items || []);
      const folderEntry = items
        .map(i => i.webkitGetAsEntry && i.webkitGetAsEntry())
        .find(entry => entry && entry.isDirectory);

      if (!folderEntry) {
        setStatus('Drop a folder, not individual files.', true);
        return;
      }

      collectFiles(folderEntry).then(files => {
        if (files.length === 0) {
          setStatus('No JPEG, TIFF, or PNG files found in that folder.', true);
          return;
        }
        uploadFiles(files, folderEntry.name);
      });
    });

    function collectFiles(dirEntry) {
      const imageExts = /\.(jpe?g|tiff?|png)$/i;
      return new Promise(resolve => {
        const reader = dirEntry.createReader();
        const filePromises = [];
        function readBatch() {
          reader.readEntries(entries => {
            console.log('readEntries batch:', entries.length, entries.map(e => e.name));
            if (!entries.length) {
              Promise.all(filePromises).then(files => {
                console.log('collected files:', files.map(f => f.name));
                resolve(files);
              });
              return;
            }
            entries.forEach(entry => {
              console.log('entry:', entry.name, entry.isFile, imageExts.test(entry.name));
              if (entry.isFile && imageExts.test(entry.name)) {
                filePromises.push(new Promise(res => entry.file(res)));
              }
            });
            readBatch();
          });
        }
        readBatch();
      });
    }

    async function uploadFiles(files, folderName) {
      setStatus('Uploading photos…');

      const form = new FormData();
      // Sort alphabetically to match AppleScript order
      files.sort((a, b) => a.name.localeCompare(b.name));
      for (const f of files) {
        form.append('images', f, folderName + '/' + f.name);
      }

      let res;
      try {
        res = await fetch('http://127.0.0.1:7890/build', { method: 'POST', body: form });
      } catch {
        setStatus('PhotoDeck.app is not running. Open it first, then try again.', true);
        return;
      }

      if (!res.ok) {
        const msg = await res.text();
        setStatus('Error: ' + msg, true);
        return;
      }

      setStatus('Downloading deck…');
      const blob = await res.blob();
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = folderName + '.key';
      a.click();
      URL.revokeObjectURL(url);
      setStatus('Done — ' + folderName + '.key downloaded.');
    }

    function setStatus(msg, isError = false) {
      status.textContent = msg;
      status.className = isError ? 'error' : '';
    }
  </script>

</body>
</html>
